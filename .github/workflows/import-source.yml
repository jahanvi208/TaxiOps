name: Import TaxiOps source tree
on:
  push:
    branches: [main]
    paths:
      - '.source-transfer/part07.txt'
      - '.github/workflows/import-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and unpack complete TaxiOps sources
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, io, pathlib, tarfile
          root = pathlib.Path(".source-transfer")
          parts = [(root / f"part{i:02d}.txt").read_text().strip() for i in range(1, 8)]
          expected = "5f716c06b8dfc12bd999846bff9f3a1f2440fef4292c7a3ac2685bff8ef0de48"
          alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
          combined = "".join(parts)
          def decode_check(value):
              try:
                  binary = base64.b64decode(value, validate=True)
              except Exception:
                  return None
              return binary if hashlib.sha256(binary).hexdigest() == expected else None
          binary = decode_check(combined)
          if binary is None and len(parts[4]) == 3499:
              prefix = "".join(parts[:4])
              suffix = "".join(parts[5:])
              damaged = parts[4]
              for pos in range(len(damaged) + 1):
                  if binary is not None:
                      break
                  for character in alphabet:
                      binary = decode_check(prefix + damaged[:pos] + character + damaged[pos:] + suffix)
                      if binary is not None:
                          print("Recovered single missing encoded character in part 5")
                          break
          if binary is None:
              raise SystemExit("Archive integrity check failed; refusing to import corrupt code")
          with tarfile.open(fileobj=io.BytesIO(binary), mode="r:xz") as archive:
              members = archive.getmembers()
              for member in members:
                  relative = pathlib.PurePosixPath(member.name)
                  if member.name.startswith("/") or ".." in relative.parts or not member.isfile():
                      raise SystemExit(f"Unsafe or unexpected archive member: {member.name}")
              archive.extractall(".", members=members, filter="data")
          print("Imported",len(members),"source files; SHA256 verified")
          PY
      - name: Commit all sources to main and remove staging
        run: |
          rm -rf .source-transfer
          mv .github/workflows/ci-cd.yml .github/ci-cd.yml.pending
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import full TaxiOps source code and CI workflows"
          git push origin HEAD:main
