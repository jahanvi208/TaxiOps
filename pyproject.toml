[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxiops"
version = "0.1.0"
description = "End-to-end NYC yellow-taxi fare estimation MLOps service"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.9,<3",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "xgboost>=3.0,<4",
  "mlflow[auth]>=3.5,<4",
  "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
train = ["pyarrow>=17,<24", "dvc>=3.5,<4", "requests>=2.31,<3"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1", "pytest-cov>=5,<8", "pyarrow>=17,<24"]
loadtest = ["locust>=2.29,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
